name: Build Windows Desktop

on:
  workflow_dispatch:
  push:
    branches:
      - main
    tags:
      - "v*"
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: windows-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Windows x64
    runs-on: windows-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build web game
        run: npm run build:web

      - name: Package Windows desktop builds
        run: npm run package:win

      - name: Package static web build
        shell: pwsh
        run: |
          Compress-Archive -Path dist/* -DestinationPath release/windows/Blood-League-Kickoff-Web.zip -Force

      - name: Generate SHA-256 checksums
        shell: pwsh
        run: |
          Get-ChildItem release/windows -File |
            Where-Object { $_.Name -ne 'SHA256SUMS.txt' } |
            Get-FileHash -Algorithm SHA256 |
            ForEach-Object { "$($_.Hash.ToLower()) *$(Split-Path $_.Path -Leaf)" } |
            Set-Content release/windows/SHA256SUMS.txt

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: Blood-League-Kickoff-Windows-x64
          path: |
            release/windows/*.exe
            release/windows/*.zip
            release/windows/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14

  publish-release:
    name: Publish tagged release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download verified build artifacts
        uses: actions/download-artifact@v4
        with:
          name: Blood-League-Kickoff-Windows-x64
          path: release-assets

      - name: Publish tagged release assets
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            release-assets/*.exe
            release-assets/*.zip
            release-assets/SHA256SUMS.txt
