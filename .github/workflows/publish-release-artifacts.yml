name: Publish Existing Release Artifacts

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Successful desktop workflow run ID containing all platform artifacts
        required: true
        type: string
      release_tag:
        description: Existing version tag and GitHub Release to receive the artifacts
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    name: Verify and attach existing artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Validate recovery inputs
        env:
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          [[ "$SOURCE_RUN_ID" =~ ^[0-9]+$ ]]
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]]

      - name: Download native build artifacts
        uses: actions/download-artifact@v8
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.source_run_id }}
          pattern: Blood-League-Kickoff-*
          path: release-artifacts
          merge-multiple: true

      - name: Verify and combine checksum manifests
        working-directory: release-artifacts
        run: |
          cat SHA256SUMS-*.txt | sort -k 2 > SHA256SUMS.txt
          sha256sum --check SHA256SUMS.txt

      - name: Attach verified artifacts to release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null
          gh release upload "$RELEASE_TAG" \
            release-artifacts/*.dmg \
            release-artifacts/*.zip \
            release-artifacts/*.exe \
            release-artifacts/*.AppImage \
            release-artifacts/SHA256SUMS.txt \
            --clobber
