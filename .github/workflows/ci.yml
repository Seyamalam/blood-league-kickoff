name: Verify Web Game

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: verify-web-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, test, type-check, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies from lockfile
        run: npm ci

      - name: Verify source formatting
        run: npm run format:check

      - name: Lint source
        run: npm run lint

      - name: Run automated tests
        run: npm test

      - name: Type-check
        run: npm run typecheck

      - name: Build production web game
        run: npm run build
