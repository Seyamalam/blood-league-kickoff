appId: games.bloodleague.kickoff
productName: Blood League Kickoff
copyright: Copyright © 2026 Blood League Kickoff contributors

directories:
  output: release/desktop

files:
  - dist/**/*
  - electron/**/*
  - package.json

extraMetadata:
  main: electron/main.cjs

asar: true
compression: normal
win:
  executableName: BloodLeagueKickoff
  artifactName: 'Blood-League-Kickoff-${version}-Windows-${arch}.${ext}'
  target:
    - target: portable
      arch:
        - x64
    - target: zip
      arch:
        - x64
  verifyUpdateCodeSignature: false

portable:
  artifactName: 'Blood-League-Kickoff-${version}-Windows-Portable-${arch}.${ext}'
  requestExecutionLevel: user

mac:
  category: public.app-category.games
  artifactName: 'Blood-League-Kickoff-${version}-macOS-${arch}.${ext}'
  target:
    - target: dmg
      arch:
        - x64
        - arm64
    - target: zip
      arch:
        - x64
        - arm64

linux:
  executableName: blood-league-kickoff
  category: Game
  artifactName: 'Blood-League-Kickoff-${version}-Linux-${arch}.${ext}'
  target:
    - target: AppImage
      arch:
        - x64
    - target: zip
      arch:
        - x64
